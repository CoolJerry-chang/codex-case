<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenAI Codex Use Cases | 案例使用指南</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #9CA3AF;
  --secondary: #4ADE80;
  --tertiary: #1F2937;
  --neutral: #FFFFFF;
  --bg: #000000;
  --surface: #FFFFFF;
  --text-primary: #6B7280;
  --text-secondary: #FFFFFF;
  --border: #1F2937;
  --accent: #9CA3AF;
  --glass-bg: rgba(255,255,255,0.03);
  --glass-border: rgba(255,255,255,0.08);
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 16px;
  --radius-xl: 32px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'JetBrains Mono', monospace;
  background: var(--bg);
  color: var(--text-secondary);
  line-height: 1.6;
  font-weight: 300;
  font-size: 14px;
}

/* Glass surface */
.glass {
  background: var(--glass-bg);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--glass-border);
}

/* Gradient border shell */
.gradient-shell {
  padding: 1px;
  border-radius: var(--radius-lg);
  background: linear-gradient(180deg, rgb(156,163,175), rgb(75,85,99), rgb(31,41,55));
}
.gradient-shell-inner {
  background: rgba(0,0,0,0.95);
  border-radius: calc(var(--radius-lg) - 1px);
  backdrop-filter: blur(12px);
}

/* Header */
.header {
  padding: 64px 32px 48px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.header::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: radial-gradient(ellipse at 50% 0%, rgba(74,222,128,0.06) 0%, transparent 60%);
  pointer-events: none;
}
.header h1 {
  font-family: 'DotGothic16', cursive;
  font-size: 72px;
  font-weight: 400;
  line-height: 72px;
  letter-spacing: -0.05em;
  color: var(--neutral);
  margin-bottom: 16px;
  position: relative;
}
.header .subtitle {
  font-size: 18px;
  color: var(--text-primary);
  font-weight: 300;
  line-height: 28px;
  max-width: 600px;
  margin: 0 auto 12px;
}
.lang-toggle {
  display: inline-flex;
  gap: 0;
  border-radius: var(--radius-sm);
  overflow: hidden;
  border: 1px solid var(--border);
  margin-top: 16px;
}
.lang-btn {
  padding: 8px 20px;
  background: transparent;
  color: var(--text-primary);
  border: none;
  cursor: pointer;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  font-weight: 500;
  transition: all 150ms ease;
}
.lang-btn.active {
  background: var(--secondary);
  color: var(--bg);
}
.lang-btn:hover:not(.active) {
  color: var(--neutral);
}

/* Stats */
.stats {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-top: 32px;
  flex-wrap: wrap;
}
.stat {
  padding: 16px 24px;
  border-radius: var(--radius-md);
  text-align: center;
  min-width: 110px;
}
.stat-num {
  font-family: 'DotGothic16', cursive;
  font-size: 36px;
  color: var(--secondary);
  line-height: 1;
}
.stat-label {
  font-size: 12px;
  color: var(--text-primary);
  margin-top: 4px;
  font-weight: 500;
}

/* Container */
.container { max-width: 1400px; margin: 0 auto; padding: 32px; }

/* Controls */
.controls {
  display: flex;
  gap: 8px;
  margin-bottom: 24px;
  flex-wrap: wrap;
  align-items: center;
}
.search-box {
  flex: 1;
  min-width: 250px;
  padding: 10px 16px;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--neutral);
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  font-weight: 300;
  outline: none;
  transition: border-color 150ms ease;
}
.search-box:focus { border-color: var(--secondary); }
.download-btn {
  display: inline-flex;
  align-items: center;
  padding: 10px 18px;
  background: var(--secondary);
  color: var(--bg);
  border: none;
  border-radius: var(--radius-sm);
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  font-weight: 500;
  text-decoration: none;
  cursor: pointer;
  transition: all 150ms ease;
  white-space: nowrap;
}
.download-btn:hover { opacity: 0.85; }
.search-box::placeholder { color: var(--text-primary); }

/* View toggle */
.view-toggle {
  display: flex;
  border-radius: var(--radius-sm);
  overflow: hidden;
  border: 1px solid var(--border);
}
.view-btn {
  padding: 10px 16px;
  background: transparent;
  color: var(--text-primary);
  border: none;
  cursor: pointer;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  font-weight: 500;
  transition: all 150ms ease;
}
.view-btn.active { background: var(--neutral); color: var(--bg); }

/* Filters */
.filter-group {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 24px;
}
.filter-btn {
  padding: 6px 12px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 9999px;
  color: var(--text-primary);
  cursor: pointer;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  font-weight: 500;
  transition: all 150ms ease;
  white-space: nowrap;
}
.filter-btn:hover { border-color: var(--primary); color: var(--neutral); }
.filter-btn.active { background: var(--secondary); color: var(--bg); border-color: var(--secondary); }

/* Sections */
.section { margin-bottom: 48px; }
.section-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.section-header h2 {
  font-family: 'DotGothic16', cursive;
  font-size: 24px;
  font-weight: 400;
  color: var(--neutral);
}
.section-count {
  font-size: 11px;
  color: var(--text-primary);
  background: rgba(255,255,255,0.05);
  padding: 2px 8px;
  border-radius: 9999px;
}

/* Grid */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
  gap: 12px;
}

/* Cards */
.card {
  border-radius: var(--radius-lg);
  padding: 1px;
  background: linear-gradient(180deg, rgba(156,163,175,0.3), rgba(75,85,99,0.2), rgba(31,41,55,0.3));
  cursor: pointer;
  transition: transform 150ms ease, box-shadow 300ms ease;
}
.card:hover {
  transform: translateY(-2px);
  box-shadow: rgba(0,0,0,0.4) 0px 10px 20px -5px, rgba(0,0,0,0.1) 0px 0px 15px 0px;
}
.card-inner {
  background: rgba(0,0,0,0.92);
  backdrop-filter: blur(12px);
  border-radius: calc(var(--radius-lg) - 1px);
  padding: 22px;
  height: 100%;
  position: relative;
}
.card-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 8px;
}
.card h3 {
  font-family: 'JetBrains Mono', monospace;
  font-size: 15px;
  font-weight: 500;
  color: var(--neutral);
  flex: 1;
  margin-right: 8px;
  line-height: 20px;
}
.card-meta { display: flex; gap: 6px; flex-shrink: 0; }
.badge {
  padding: 2px 8px;
  border-radius: 9999px;
  font-size: 11px;
  font-weight: 500;
  white-space: nowrap;
  letter-spacing: 0.02em;
}
.badge-easy { background: rgba(74,222,128,0.15); color: var(--secondary); border: 1px solid rgba(74,222,128,0.2); }
.badge-advanced { background: rgba(156,163,175,0.15); color: var(--primary); border: 1px solid rgba(156,163,175,0.2); }
.badge-time { background: rgba(255,255,255,0.05); color: var(--text-primary); border: 1px solid var(--border); }

.card-desc {
  color: var(--text-primary);
  font-size: 13px;
  margin-bottom: 12px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  line-height: 20px;
}
.card-tags { display: flex; gap: 4px; flex-wrap: wrap; }
.tag {
  padding: 2px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 11px;
  color: var(--text-primary);
  font-weight: 500;
}

/* Card expand */
.card-details {
  display: none;
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}
.card.expanded .card-details { display: block; }
.card.expanded .card-desc { -webkit-line-clamp: unset; }

.detail-section { margin-bottom: 12px; }
.detail-label {
  font-size: 11px;
  color: var(--secondary);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 4px;
  font-weight: 500;
}
.detail-text { font-size: 13px; color: var(--text-primary); line-height: 20px; }
.steps-list { list-style: none; counter-reset: step; }
.steps-list li {
  counter-increment: step;
  padding: 4px 0;
  font-size: 13px;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 8px;
}
.steps-list li::before {
  content: counter(step);
  width: 20px; height: 20px;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px;
  color: var(--secondary);
  border: 1px solid rgba(74,222,128,0.2);
  border-radius: 9999px;
  flex-shrink: 0;
}
.card-link {
  display: inline-block;
  margin-top: 12px;
  color: var(--secondary);
  text-decoration: none;
  font-size: 13px;
  font-weight: 500;
  transition: color 150ms ease;
}
.card-link:hover { color: var(--neutral); }
.expand-hint {
  position: absolute;
  top: 22px; right: 22px;
  color: var(--text-primary);
  font-size: 10px;
  transition: transform 150ms ease;
  opacity: 0.5;
}
.card.expanded .expand-hint { transform: rotate(180deg); }

/* Skills pills */
.skills-wrap {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 4px;
}
.skill-tag {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  background: rgba(74,222,128,0.08);
  border: 1px solid rgba(74,222,128,0.18);
  border-radius: 9999px;
  font-size: 11px;
  font-weight: 500;
  color: var(--secondary);
  cursor: default;
  transition: background 150ms ease;
}
.skill-tag:hover {
  background: rgba(74,222,128,0.16);
}
.skill-tag .skill-tip {
  display: none;
  position: absolute;
  bottom: calc(100% + 6px);
  left: 50%;
  transform: translateX(-50%);
  background: rgba(30,30,30,0.97);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 6px 10px;
  font-size: 11px;
  font-weight: 300;
  color: var(--text-primary);
  white-space: normal;
  width: max-content;
  max-width: 260px;
  line-height: 1.4;
  z-index: 10;
  pointer-events: none;
}
.skill-tag:hover .skill-tip {
  display: block;
}

/* Prompt block */
.prompt-block {
  position: relative;
  margin-top: 4px;
  padding: 10px 40px 10px 12px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  font-weight: 300;
  color: var(--text-primary);
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
}
.prompt-copy-btn {
  position: absolute;
  top: 6px;
  right: 6px;
  width: 26px;
  height: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text-primary);
  cursor: pointer;
  font-size: 13px;
  transition: all 150ms ease;
  padding: 0;
  line-height: 1;
}
.prompt-copy-btn:hover {
  background: rgba(74,222,128,0.15);
  color: var(--secondary);
  border-color: rgba(74,222,128,0.3);
}

/* Table */
.table-view { display: none; overflow-x: auto; }
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
th {
  background: rgba(255,255,255,0.03);
  padding: 10px 12px;
  text-align: left;
  font-weight: 500;
  color: var(--primary);
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  white-space: nowrap;
  user-select: none;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
th:hover { color: var(--secondary); }
td {
  padding: 10px 12px;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  color: var(--text-primary);
  vertical-align: top;
}
tr:hover td { background: rgba(255,255,255,0.02); }
td a { color: var(--secondary); text-decoration: none; font-weight: 500; }
td a:hover { color: var(--neutral); }
td .skill-tag {
  margin: 1px 0;
  font-size: 10px;
  padding: 2px 7px;
}
td .prompt-block {
  font-size: 11px;
  padding: 6px 8px;
  margin-top: 0;
}

/* No results */
.no-results {
  text-align: center;
  padding: 64px 32px;
  color: var(--text-primary);
  font-size: 16px;
  display: none;
}

/* Footer */
.footer {
  text-align: center;
  padding: 32px;
  color: var(--text-primary);
  font-size: 12px;
  border-top: 1px solid var(--border);
  margin-top: 32px;
}
.footer a { color: var(--secondary); text-decoration: none; }

@media (max-width: 768px) {
  .grid { grid-template-columns: 1fr; }
  .controls { flex-direction: column; }
  .header h1 { font-size: 36px; line-height: 40px; }
  .header { padding: 32px 16px 24px; }
  .container { padding: 16px; }
  .skill-tag .skill-tip { max-width: 200px; }
}
</style>
</head>

{t:"Manage your inbox",tz:"管理你的收件匣",d:"Have Codex find the emails that matter and write the replies in your voice.",dz:"讓 Codex 找到重要郵件並用你的語氣撰寫回覆。",tg:["Automation","Integrations"],u:"https://developers.openai.com/codex/use-cases/manage-your-inbox",df:"Easy",tm:"5m",ov:"Use Codex with Gmail to find emails that need attention, draft responses in your voice, pull context from the tools where your work happens, and keep watching for new replies on a schedule.",ovz:"搭配 Gmail 使用 Codex，找到需要處理的郵件，用你的語氣草擬回覆，從工作工具中提取上下文，並定期監控新回覆。",bf:"People who want Codex to find emails that need attention instead of manually sorting them.",bfz:"希望 Codex 自動篩選重要郵件、不想手動整理收件匣的人。",st:["Review your inbox","Let the thread learn your taste","Automate email triage on a schedule","Organize your inbox"],stz:["檢視收件匣","讓對話學習你的偏好","排程自動分類郵件","整理收件匣"],sk:[{n:"Gmail",d:"Search and triage Gmail threads, read conversations, create reply drafts, and organize messages."},{n:"Slack",d:"Check team-message context when an email needs the latest decision, owner, asset, or blocker."},{n:"Google Drive",d:"Read source docs, FAQs, notes, or approved writing examples that should shape the draft."}],skz:["搜尋和分類 Gmail 對話、閱讀對話內容、建立回覆草稿並整理郵件。","當郵件需要最新決策、負責人或障礙時，從 Slack 查找團隊訊息。","讀取文件、FAQ、筆記或已批准的寫作範例來塑造草稿。"],sp:"Can you check my @gmail, figure out what I need to respond to, and write drafts in my voice. Use my recent sent replies or @google-drive [writing examples] for tone. Use @slack, @google-drive, or other sources where my work happens when the email is missing the latest decision, owner, file, or blocker.",spz:"請檢查我的 @gmail，找出需要回覆的郵件，並用我的語氣寫草稿。使用我最近的寄件備份或 @google-drive [寫作範例] 作為語氣參考。當郵件缺少最新決策、負責人、檔案或障礙時，使用 @slack、@google-drive 或其他工作來源。"},

{t:"Follow a goal",tz:"追蹤目標",d:"Give Codex a durable objective for long-running work.",dz:"給 Codex 一個持久性目標來執行長期任務。",tg:["Engineering","Automation"],u:"https://developers.openai.com/codex/use-cases/follow-goals",df:"Advanced",tm:"1h",ov:"Give Codex a durable objective that persists across sessions, checks connected sources on a schedule, and surfaces progress or issues without being re-prompted.",ovz:"設定一個跨工作階段的持久性目標，讓 Codex 定期檢查來源並主動回報進度。",bf:"Objectives that span days or weeks and need regular check-ins.",bfz:"需要持續數天或數週、定期追蹤進度的目標。",st:["Define the goal clearly","Set the schedule and sources","Review and refine"],stz:["清楚定義目標","設定排程和資料來源","檢視並優化"],sk:[],skz:[],sp:"/goal Complete [objective] without stopping until [verifiable end state].",spz:"/goal 完成 [目標]，直到 [可驗證的結束狀態] 才停止。"},
{t:"Set up a teammate",tz:"設定 AI 隊友",d:"Give Codex a durable view of your work so it can notice what changed.",dz:"讓 Codex 持續監控你的工作並主動通知變更。",tg:["Automation","Integrations"],u:"https://developers.openai.com/codex/use-cases/proactive-teammate",df:"Advanced",tm:"1h",ov:"Configure Codex as a persistent teammate that watches your connected tools and proactively surfaces changes, blockers, or follow-ups.",ovz:"設定 Codex 為持續工作的隊友，監控連接的工具並主動通知變更、阻礙或後續事項。",bf:"Teams that want a persistent assistant monitoring Slack, Linear, GitHub, or other tools.",bfz:"需要持續監控 Slack、Linear、GitHub 等工具的團隊。",st:["Connect your tools","Define the teammate's scope","Set notification preferences","Iterate on the briefing"],stz:["連接你的工具","定義隊友的職責範圍","設定通知偏好","迭代優化簡報內容"],sk:[{n:"Slack",d:"Find context around asks, owner changes, blockers, and decisions."},{n:"Gmail",d:"Find reply-worthy threads and cross-check against the workstream."},{n:"Google Calendar",d:"Use meetings to decide which updates matter now."},{n:"Notion",d:"Read project notes, trackers, or decision logs."}],skz:["找到請求、負責人變更、障礙和決策的脈絡。","找到值得回覆的郵件並與工作流交叉檢查。","用會議判斷哪些更新現在最重要。","讀取專案筆記、追蹤表或決策日誌。"],sp:"Can you check @slack, @gmail, @google-calendar, and @notion and tell me what needs my attention? Look for anything important or surprising that I might miss.",spz:"請檢查 @slack、@gmail、@google-calendar 和 @notion，告訴我什麼需要我的注意？找出任何我可能遺漏的重要或意外事項。"},
{t:"Turn feedback into actions",tz:"將回饋轉化為行動",d:"Synthesize feedback from multiple sources into a reviewable artifact.",dz:"將多個來源的回饋整合成可審閱的文件。",tg:["Data","Integrations"],u:"https://developers.openai.com/codex/use-cases/feedback-synthesis",df:"Easy",tm:"30m",ov:"Pull feedback from Slack, Linear, surveys, and other sources into a single reviewable artifact with themes, priorities, and suggested next steps.",ovz:"從 Slack、Linear、問卷等多個來源彙整回饋，產出包含主題、優先級和建議行動的文件。",bf:"Product teams collecting feedback from multiple channels.",bfz:"需要從多管道收集回饋的產品團隊。",st:["Gather feedback sources","Synthesize themes","Create the artifact","Iterate"],stz:["收集回饋來源","歸納主題","建立文件","迭代改進"],sk:[{n:"Slack",d:"Read approved feedback channels or thread links."},{n:"GitHub",d:"Read issues, PR comments, and discussion threads."},{n:"Linear",d:"Read bug or feature queues."},{n:"Google Drive",d:"Read feedback docs, exports, and folders."},{n:"Google Sheets",d:"Create a feedback sheet the team can sort and update."}],skz:["讀取已批准的回饋頻道或對話連結。","讀取 Issue、PR 評論和討論串。","讀取 Bug 或功能佇列。","讀取回饋文件、匯出和資料夾。","建立團隊可排序和更新的回饋試算表。"],sp:"Can you synthesize the beta feedback on [feature or product area] into a @google-sheets review sheet?",spz:"請將 [功能或產品區域] 的 Beta 回饋整合到 @google-sheets 審查表中。"},
{t:"Clean and prepare messy data",tz:"清理和整理雜亂數據",d:"Process tabular data without affecting the original.",dz:"處理表格數據，不影響原始檔案。",tg:["Data","Knowledge Work"],u:"https://developers.openai.com/codex/use-cases/clean-messy-data",df:"Easy",tm:"5m",ov:"Drag in or mention a messy CSV or spreadsheet, describe the problems you see, and ask Codex to write a cleaned copy while keeping the original file unchanged.",ovz:"拖入或提及雜亂的 CSV 或試算表，描述問題並讓 Codex 產生清理後的副本，原始檔案不變。",bf:"CSV or spreadsheet exports with mixed dates, currencies, duplicates, or missing values.",bfz:"日期混亂、幣值不一、重複或缺值的 CSV 或試算表。",st:["Introduction","How to use"],stz:["介紹","使用方式"],sk:[{n:"Spreadsheet",d:"Inspect tabular files, clean columns, and produce reviewable outputs."}],skz:["檢查表格檔案、清理欄位並產出可審閱的輸出。"],sp:"Clean @[filename].csv. What's wrong: [describe issues]. What I want: [describe desired output].",spz:"清理 @[檔案名].csv。問題：[描述問題]。我要的結果：[描述期望輸出]。"},

{t:"Review GitHub pull requests",tz:"審查 GitHub PR",d:"Catch regressions and potential issues before human review.",dz:"在人工審查前捕捉迴歸錯誤和潛在問題。",tg:["Integrations","Workflow"],u:"https://developers.openai.com/codex/use-cases/github-code-reviews",df:"Easy",tm:"30m",ov:"Connect Codex to GitHub and ask it to review open PRs, flag regressions, check test coverage, and leave structured comments.",ovz:"連接 Codex 到 GitHub，審查開放的 PR、標記迴歸問題、檢查測試覆蓋率並留下結構化評論。",bf:"Engineering teams that want a first-pass reviewer before human review.",bfz:"需要在人工審查前進行初步審查的工程團隊。",st:["How to use","Tips"],stz:["使用方式","提示"],sk:[{n:"Security Best Practices",d:"Focus review on risky surfaces such as secrets, auth, and dependency changes."}],skz:["聚焦審查在高風險面向，如密鑰、驗證和依賴變更。"],sp:"@codex review for security regressions, missing tests, and risky behavior changes.",spz:"@codex 審查安全迴歸、缺少的測試和有風險的行為變更。"},

{t:"Build a Mac app shell",tz:"建構 Mac 應用程式框架",d:"Use Codex to build a Mac-native SwiftUI app shell with a sidebar, detail pane, inspector...",dz:"用 Codex 建構 Mac 原生 SwiftUI 應用程式框架。",tg:["macOS","Code"],u:"https://developers.openai.com/codex/use-cases/macos-sidebar-detail-inspector",df:"Advanced",tm:"1h",ov:"Use Codex to scaffold a Mac-native SwiftUI app with sidebar navigation, detail pane, inspector panel, toolbar, and keyboard shortcuts.",ovz:"使用 Codex 搭建 Mac 原生 SwiftUI 應用，含側邊欄、詳情面板、檢查器和快捷鍵。",bf:"Developers building Mac-native productivity tools.",bfz:"開發 Mac 原生生產力工具的開發者。",st:["Start from the Mac scene model","Build a sidebar, detail pane, and inspector","Put commands, toolbars, and shortcuts in the desktop layer","Keep preferences in Settings","Validate the shell"],stz:["從 Mac scene model 開始","建構側邊欄、詳情面板和檢查器","加入指令、工具列和快捷鍵","保持設定在 Settings 中","驗證框架"],sk:[{n:"Build macOS Apps",d:"Use macOS SwiftUI patterns, window management, and build/run skills."}],skz:["使用 macOS SwiftUI 模式、視窗管理和建構/執行技能。"],sp:"Use the Build macOS Apps plugin to turn [app idea] into a Mac-native SwiftUI app shell with sidebar, detail pane, inspector, commands, and Settings.",spz:"使用 Build macOS Apps 外掛將 [應用想法] 轉為 Mac 原生 SwiftUI 應用框架，含側邊欄、詳情面板、檢查器、指令和設定。"},
{t:"Automate bug triage",tz:"自動化 Bug 分類",d:"Turn daily bug reports into a prioritized list, then automate the sweep.",dz:"將每日 Bug 報告轉為優先順序清單並自動化處理。",tg:["Automation","Quality"],u:"https://developers.openai.com/codex/use-cases/automation-bug-triage",df:"",tm:"1h",ov:"Use Codex to collect bug reports from multiple sources, categorize and prioritize them, then automate the triage workflow on a schedule.",ovz:"使用 Codex 收集多來源的 Bug 報告，分類排序優先級，然後排程自動化分類流程。",bf:"QA and engineering teams with high bug report volume.",bfz:"Bug 報告量大的 QA 和工程團隊。",st:["Phase 1: Run the sweep","Phase 2: Make the report useful","Phase 3: Automate it","Phase 4: Route follow-ups"],stz:["階段一：執行掃描","階段二：讓報告有用","階段三：自動化","階段四：路由後續追蹤"],sk:[{n:"GitHub",d:"Read issues, PRs, comments, and failed checks."},{n:"Sentry",d:"Inspect production errors, stack traces, and event context."},{n:"Slack",d:"Read bug report channels and prepare draft summaries."},{n:"Linear",d:"Read bug queues and draft follow-up tickets."}],skz:["讀取 Issue、PR、評論和失敗的檢查。","檢查生產環境錯誤、堆疊追蹤和事件脈絡。","讀取 Bug 報告頻道並準備摘要草稿。","讀取 Bug 佇列並草擬後續追蹤工單。"],sp:"Run a bug triage sweep for [repo/service/team] covering the last [time window].",spz:"對 [倉庫/服務/團隊] 執行 Bug 分類掃描，涵蓋最近 [時間範圍]。"},

const CATS={
"Automation":{icon:"⚡",c:8},"Integrations":{icon:"🔗",c:17},"Data":{icon:"📈",c:10},"Knowledge Work":{icon:"📚",c:12},"Engineering":{icon:"🛠️",c:13},"Front-end":{icon:"🎨",c:6},"iOS":{icon:"📱",c:5},"macOS":{icon:"💻",c:3},"Mobile":{icon:"📲",c:1},"Evaluation":{icon:"📊",c:3},"Quality":{icon:"✅",c:4},"Workflow":{icon:"🔄",c:4},"Design":{icon:"🖌️",c:3},"Analysis":{icon:"🔍",c:2},"Code":{icon:"💡",c:13}
};

let lang='zh', filter='all', search='', view='card';

function setLang(l){
  lang=l;
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.textContent===(l==='zh'?'中文':'EN')));
  document.querySelectorAll('[data-zh]').forEach(el=>{el.textContent=el.dataset[l]||el.dataset.zh;});
  const sb=document.getElementById('searchBox');
  sb.placeholder=sb.dataset[l+'Placeholder']||sb.dataset.zhPlaceholder;
  render();
}

function setView(v){
  view=v;
  document.querySelectorAll('.view-btn').forEach(b=>b.classList.toggle('active',false));
  document.querySelectorAll('.view-btn').forEach(b=>{
    const isCard=(v==='card'&&(b.dataset.zh==='卡片'));
    const isTable=(v==='table'&&(b.dataset.zh==='表格'));
    if(isCard||isTable) b.classList.add('active');
  });
  render();
}

function toggleFilter(n){
  filter=filter===n?'all':n;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter));
  render();
}

// Build filter buttons
const fg=document.getElementById('filterGroup');
Object.entries(CATS).forEach(([n,c])=>{
  const b=document.createElement('button');
  b.className='filter-btn';b.dataset.filter=n;
  b.textContent=c.icon+' '+n+' ('+c.c+')';
  b.onclick=()=>toggleFilter(n);
  fg.appendChild(b);
});

document.getElementById('searchBox').addEventListener('input',e=>{search=e.target.value.toLowerCase();render();});

function filtered(){
  return DATA.filter(item=>{
    const mf=filter==='all'||item.tg.includes(filter);
    const txt=lang==='zh'?(item.tz+item.dz+item.ovz):(item.t+item.d+item.ov);
    const ms=!search||txt.toLowerCase().includes(search)||item.tg.some(t=>t.toLowerCase().includes(search));
    return mf&&ms;
  });
}

function escHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function copyPrompt(btn,text){
  navigator.clipboard.writeText(text).then(()=>{
    btn.textContent='✓';
    setTimeout(()=>{btn.textContent='⎘';},1200);
  });
}

function mkCard(item){
  const c=document.createElement('div');c.className='card';
  c.onclick=e=>{if(e.target.tagName==='A'||e.target.classList.contains('prompt-copy-btn'))return;c.classList.toggle('expanded');};
  const title=lang==='zh'?item.tz:item.t;
  const desc=lang==='zh'?item.ovz:item.ov;
  const bestFor=lang==='zh'?item.bfz:item.bf;
  const steps=lang==='zh'?item.stz:item.st;
  const viewDoc=lang==='zh'?'查看官方文件 →':'View Official Docs →';
  const scenLabel=lang==='zh'?'適用場景':'Best For';
  const stepLabel=lang==='zh'?'步驟流程':'Workflow Steps';
  const skillLabel=lang==='zh'?'技能與外掛':'Skills & Plugins';
  const promptLabel=lang==='zh'?'起始提示':'Starter Prompt';
  const db=item.df?'<span class="badge badge-'+item.df.toLowerCase()+'">'+item.df+'</span>':'';
  const tb=item.tm?'<span class="badge badge-time">'+item.tm+'</span>':'';
  const bfH=bestFor?'<div class="detail-section"><div class="detail-label">'+scenLabel+'</div><div class="detail-text">'+bestFor+'</div></div>':'';

  // Skills section
  let skH='';
  if(item.sk&&item.sk.length>0){
    const pills=item.sk.map((s,i)=>{
      const tipText=lang==='zh'?(item.skz[i]||s.d):s.d;
      return '<span class="skill-tag">'+escHtml(s.n)+'<span class="skill-tip">'+escHtml(tipText)+'</span></span>';
    }).join('');
    skH='<div class="detail-section"><div class="detail-label">'+skillLabel+'</div><div class="skills-wrap">'+pills+'</div></div>';
  }

  // Starter prompt section
  let spH='';
  if(item.sp){
    const promptText=lang==='zh'?(item.spz||item.sp):item.sp;
    spH='<div class="detail-section"><div class="detail-label">'+promptLabel+'</div><div class="prompt-block"><button class="prompt-copy-btn" onclick="copyPrompt(this,this.parentElement.dataset.prompt)" title="Copy">⎘</button>'+escHtml(promptText)+'</div></div>';
  }

  const stH=steps.length?'<div class="detail-section"><div class="detail-label">'+stepLabel+'</div><ol class="steps-list">'+steps.map(s=>'<li>'+s+'</li>').join('')+'</ol></div>':'';
  c.innerHTML='<div class="card-inner"><span class="expand-hint">▼</span><div class="card-top"><h3>'+title+'</h3><div class="card-meta">'+db+tb+'</div></div><div class="card-desc">'+desc+'</div><div class="card-tags">'+item.tg.map(t=>'<span class="tag">'+t+'</span>').join('')+'</div><div class="card-details">'+bfH+skH+spH+stH+'<a class="card-link" href="'+item.u+'" target="_blank" rel="noopener">'+viewDoc+'</a></div></div>';
  // Store prompt text for copy
  const pb=c.querySelector('.prompt-block');
  if(pb){
    const promptText=lang==='zh'?(item.spz||item.sp):item.sp;
    pb.dataset.prompt=promptText;
  }
  return c;
}

function render(){
  const f=filtered();
  document.getElementById('noResults').style.display=f.length===0?'block':'none';
  const cc=document.getElementById('cardContainer');
  const tc=document.getElementById('tableContainer');
  if(view==='card'){
    cc.style.display='block';tc.style.display='none';cc.innerHTML='';
    if(filter==='all'&&!search){
      const grouped={};const seen=new Set();
      const order=["Automation","Integrations","Data","Knowledge Work","Engineering","Front-end","iOS","macOS","Mobile","Evaluation","Quality","Workflow","Design","Analysis","Code"];
      order.forEach(cat=>{
        const items=DATA.filter(i=>i.tg[0]===cat&&!seen.has(DATA.indexOf(i)));
        items.forEach(i=>seen.add(DATA.indexOf(i)));
        if(items.length)grouped[cat]=items;
      });
      const rem=DATA.filter((_,i)=>!seen.has(i));
      if(rem.length)grouped['Other']=rem;
      Object.entries(grouped).forEach(([cat,items])=>{
        const ci=CATS[cat]||{icon:'📋'};
        const s=document.createElement('div');s.className='section';s.id='cat-'+cat.replace(/\s/g,'-');
        const countLabel=lang==='zh'?' 個案例':' cases';
        s.innerHTML='<div class="section-header"><h2>'+ci.icon+' '+cat+'</h2><span class="section-count">'+items.length+countLabel+'</span></div>';
        const g=document.createElement('div');g.className='grid';
        items.forEach(i=>g.appendChild(mkCard(i)));
        s.appendChild(g);cc.appendChild(s);
      });
    }else{
      const g=document.createElement('div');g.className='grid';
      f.forEach(i=>g.appendChild(mkCard(i)));cc.appendChild(g);
    }
  }else{
    cc.style.display='none';tc.style.display='block';
    const skillLabel=lang==='zh'?'技能與外掛':'Skills & Plugins';
    const promptLabel=lang==='zh'?'起始提示':'Starter Prompt';
    const hn=lang==='zh'?['案例名稱','中文名稱','難度','時間','分類',skillLabel,'說明']:['Case Name','','Difficulty','Time','Categories',skillLabel,'Description'];
    let h='<table><thead><tr>'+hn.filter(x=>x).map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>';
    f.forEach(item=>{
      const dc=item.df?'badge-'+item.df.toLowerCase():'';
      const skPills=(item.sk&&item.sk.length>0)?item.sk.map((s,i)=>{
        const tipText=lang==='zh'?(item.skz[i]||s.d):s.d;
        return '<span class="skill-tag" title="'+escHtml(tipText)+'">'+escHtml(s.n)+'</span>';
      }).join(' '):'-';
      if(lang==='zh'){
        h+='<tr><td><a href="'+item.u+'" target="_blank">'+item.t+'</a></td><td>'+item.tz+'</td><td>'+(item.df?'<span class="badge '+dc+'">'+item.df+'</span>':'-')+'</td><td>'+(item.tm||'-')+'</td><td>'+item.tg.map(t=>'<span class="tag">'+t+'</span>').join(' ')+'</td><td>'+skPills+'</td><td style="max-width:300px">'+item.dz+'</td></tr>';
      }else{
        h+='<tr><td><a href="'+item.u+'" target="_blank">'+item.t+'</a></td><td>'+(item.df?'<span class="badge '+dc+'">'+item.df+'</span>':'-')+'</td><td>'+(item.tm||'-')+'</td><td>'+item.tg.map(t=>'<span class="tag">'+t+'</span>').join(' ')+'</td><td>'+skPills+'</td><td style="max-width:400px">'+item.d+'</td></tr>';
      }
    });
    h+='</tbody></table>';tc.innerHTML=h;
  }
}
render();
</script>
